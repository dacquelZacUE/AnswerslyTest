<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>.</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
  }
  #msg {
    display: none;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    font-family: system-ui, sans-serif;
    font-size: 8vw;
    font-weight: 700;
    color: #d00000;
  }
  #msg.show {
    display: flex;
  }
  #hint {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    font-family: system-ui, sans-serif;
    font-size: 4vw;
    color: #999;
  }
  #hint.hide {
    display: none;
  }
</style>
</head>
<body>
<div id="hint">leave tab to test</div>
<div id="msg">hala huli ka, chuchupain ka ni rafa</div>
<script>
  var CAUGHT = "hala huli ka, chuchupain ka ni rafa";
  var DEFAULT_TITLE = document.title;
  var msg = document.getElementById("msg");
  var hint = document.getElementById("hint");
  var away = false;

  function markAway() {
    if (away) return;
    away = true;
    document.title = CAUGHT;
  }

  function markBack() {
    if (!away) return;
    if (document.hidden || !document.hasFocus()) return;
    away = false;
    document.title = DEFAULT_TITLE;
    hint.classList.add("hide");
    msg.classList.add("show");
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) markAway();
    else markBack();
  });

  window.addEventListener("blur", markAway);
  window.addEventListener("focus", markBack);
  window.addEventListener("pagehide", markAway);
  window.addEventListener("pageshow", markBack);
</script>
</body>
</html>
